<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - MotorFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-dark">

    <!-- Navbar Privado -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">
                <i class="bi bi-gear-wide-connected me-2"></i>MotorFix
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-dark me-3 d-none d-md-block fw-bold" id="userInfo"></span>
                <button class="btn btn-danger btn-sm fw-bold" id="btnLogout">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container mt-4 mb-5">
        
        <!-- Perfil del Usuario -->
        <div class="p-3 mb-4 rounded-4 bg-surface border shadow-sm d-flex flex-row align-items-center justify-content-between">
            <div>
                <span class="badge bg-primary mb-1" id="perfilRolBadge">CARGANDO...</span>
                <h4 class="text-dark mb-0 fw-bold" id="perfilNombre">...</h4>
                <small class="text-secondary" id="perfilEmail">...</small>
            </div>
            <i class="bi bi-person-circle text-primary display-4 d-none d-sm-block"></i>
        </div>

        <!-- VISTA: FORMULARIO DE SOLICITUD -->
        <div class="rounded-4 bg-surface border shadow-sm mb-4" id="formSection">
            <div class="p-3 border-bottom">
                <h5 class="mb-0 text-primary fw-bold" id="formTitle"><i class="bi bi-pencil-square me-2"></i>Registrar Nueva Solicitud</h5>
            </div>
            <div class="p-4">
                <form id="solicitudForm">
                    <input type="hidden" id="solicitudId">
                    
                    <h6 class="text-primary fw-bold mb-3 border-bottom pb-2 small text-uppercase">1. Datos del Cliente</h6>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-secondary small fw-bold">Nombre del Cliente</label>
                            <input type="text" class="form-control" id="clienteNombre" required>
                        </div>
                        <div class="col-md-4 mb-3" id="adminEmailSection" style="display:none;">
                            <label class="form-label text-secondary small fw-bold">Email del Cliente</label>
                            <input type="email" class="form-control" id="clienteEmail" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-secondary small fw-bold">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" maxlength="10" required>
                        </div>
                    </div>

                    <h6 class="text-primary fw-bold mb-3 border-bottom pb-2 mt-4 small text-uppercase">2. Datos del Vehículo</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-secondary small fw-bold">Placa</label>
                            <input type="text" class="form-control text-uppercase" id="placa" placeholder="ABC-1234" maxlength="8" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-secondary small fw-bold">Marca</label>
                            <input type="text" class="form-control" id="marca" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-secondary small fw-bold">Modelo</label>
                            <input type="text" class="form-control" id="modelo" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-secondary small fw-bold">Año</label>
                            <input type="number" class="form-control" id="anio" min="1980" max="2027" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-secondary small fw-bold">Kilometraje</label>
                            <input type="number" class="form-control" id="kilometraje" min="0" required>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label text-secondary small fw-bold d-block">Prioridad</label>
                            <div class="form-check form-check-inline mt-2">
                                <input class="form-check-input" type="radio" name="prioridad" id="prio-normal" value="Normal" checked>
                                <label class="form-check-label text-dark" for="prio-normal">Normal</label>
                            </div>
                            <div class="form-check form-check-inline mt-2">
                                <input class="form-check-input" type="radio" name="prioridad" id="prio-urgente" value="Urgente">
                                <label class="form-check-label text-dark" for="prio-urgente">Urgente</label>
                            </div>
                        </div>
                    </div>

                    <h6 class="text-primary fw-bold mb-3 border-bottom pb-2 mt-4 small text-uppercase">3. Detalle y Agenda</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary small fw-bold">Servicio</label>
                            <select class="form-select" id="tipoServicio" required>
                                <option value="">Seleccione...</option>
                                <option value="Mantenimiento Preventivo">Mantenimiento Preventivo</option>
                                <option value="Diagnóstico">Diagnóstico</option>
                                <option value="Alineación">Alineación</option>
                                <option value="Cambio de Aceite y Filtros">Cambio de Aceite y Filtros</option>
                                <option value="Sistema de Frenos">Sistema de Frenos</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-secondary small fw-bold">Fecha</label>
                            <input type="date" class="form-control" id="fecha" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-secondary small fw-bold">Hora</label>
                            <input type="time" class="form-control" id="hora" min="08:00" max="17:30" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold d-block">Extras</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="adicionales" id="chk-niveles" value="Revisión de niveles">
                            <label class="form-check-label text-dark" for="chk-niveles">Revisión de niveles</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="adicionales" id="chk-lavado" value="Lavado exterior">
                            <label class="form-check-label text-dark" for="chk-lavado">Lavado exterior</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold">Observaciones</label>
                        <textarea class="form-control" id="comentarios" rows="2"></textarea>
                    </div>

                    <div class="mb-4" id="estadoSection" style="display:none;">
                        <label class="form-label text-warning fw-bold small text-uppercase">Estado (Solo Admin)</label>
                        <select class="form-select border-warning" id="estado">
                            <option value="Pendiente">Pendiente</option>
                            <option value="En revisión">En revisión</option>
                            <option value="En proceso">En proceso</option>
                            <option value="Finalizado">Finalizado</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" id="btnCancelarEdicion" style="display:none;">Cancelar Edición</button>
                        <button type="submit" class="btn btn-primary text-white fw-bold" id="btnGuardar">Guardar Solicitud</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- VISTA: TABLA -->
        <div class="rounded-4 bg-surface border shadow-sm">
            <div class="p-3 border-bottom d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h5 class="mb-0 text-primary fw-bold" id="tituloTabla">Mis Solicitudes</h5>
                
                <div id="filtroContainer" class="d-none d-flex align-items-center gap-3">
                    <span id="resumenAdmin" class="small fw-bold"></span>
                    <div class="d-flex align-items-center gap-2">
                        <label class="text-secondary small fw-bold mb-0">Filtrar:</label>
                        <select id="filtroEstado" class="form-select form-select-sm" style="width: auto;">
                            <option value="TODOS">Todos</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="En revisión">En revisión</option>
                            <option value="En proceso">En proceso</option>
                            <option value="Finalizado">Finalizado</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>
                <span id="contadorCliente" class="badge bg-primary d-none">0 registros</span>
            </div>
            <div class="p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="text-secondary small text-uppercase">ID</th>
                                <th class="text-secondary small text-uppercase">Cliente</th>
                                <th class="text-secondary small text-uppercase">Vehículo</th>
                                <th class="text-secondary small text-uppercase">Servicio</th>
                                <th class="text-secondary small text-uppercase">Fecha / Hora</th>
                                <th class="text-secondary small text-uppercase">Estado</th>
                                <th class="text-secondary small text-uppercase">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaSolicitudes" class="border-top-0"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
