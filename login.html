<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MotorFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-dark d-flex flex-column min-vh-100 justify-content-center py-4">

    <main class="container" style="max-width: 500px;">
        <!-- Tarjeta de Login -->
        <div class="p-4 rounded-4 bg-surface border shadow-lg mb-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                <h2 class="text-dark mt-2 fw-bold">Acceso al Sistema</h2>
                <p class="text-secondary small">Ingresa tus credenciales para gestionar mantenimientos.</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small fw-bold">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="usuario@correo.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label text-secondary small fw-bold">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary text-white fw-bold w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>
            </form>
            <div class="text-center">
                <a href="index.html" class="text-primary text-decoration-none small fw-bold"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
            </div>
        </div>

        <!-- Usuarios de Prueba -->
        <div class="p-3 rounded-4 bg-surface border shadow-sm">
            <h6 class="text-primary fw-bold mb-3 border-bottom pb-2">Usuarios de Prueba</h6>
            <div class="d-flex flex-column gap-2">
                <div class="d-flex justify-content-between align-items-center">
                    <div><span class="badge bg-warning text-dark me-2">Admin</span><small class="text-dark fw-bold">admin@taller.com / admin123</small></div>
                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('email').value='admin@taller.com'; document.getElementById('password').value='admin123';">Usar</button>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <div><span class="badge bg-info text-dark me-2">Cliente</span><small class="text-dark fw-bold">cliente1@test.com / 123</small></div>
                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('email').value='cliente1@test.com'; document.getElementById('password').value='123';">Usar</button>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <div><span class="badge bg-danger me-2">Bloqueado</span><small class="text-dark fw-bold">bloqueado@test.com / 123</small></div>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="document.getElementById('email').value='bloqueado@test.com'; document.getElementById('password').value='123';">Usar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/auth.js"></script>
</body>
</html>
